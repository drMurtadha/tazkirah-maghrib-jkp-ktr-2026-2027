nilaian sumber yang dinyatakan.\n\nFrasa lebih 90 tahun dalam abstrak merujuk konteks penerbitan tahun 2016, bukan pengiraan sehingga tarikh pembentangan.", "links": [], "type": "list", "body": ["1913: pembinaan Madrasah al-Attas al-Arabiyah di Johor Bahru menurut artikel.", "1922: bukti cetakan doktrin Ratib al-Attas yang penulis gunakan bagi perkembangan di Johor.", "1952: cetakan di Singapura. Artikel turut menghuraikan pengamalan di Indonesia dan Brunei."]}, {"id": 7, "section": "KAEDAH PENGAMALAN", "title": "Susunan sebuah majlis", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 102–105", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 102–105. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.\n\nArtikel mengaitkan tambahan al-Hasyr serta dua ayat terakhir al-Baqarah dengan Habib Ali bin Hasan al-Attas. Doa akhir dikaitkan dengan Habib Abdullah bin Alwi al-Haddad.", "links": [], "type": "list", "body": ["Pembimbing memberi tazkirah ringkas dan menyatakan hajat perhimpunan.", "Pembukaan al-Fatihah dan bacaan al-Hasyr 59:21–24.", "Bacaan 17 zikir secara berturutan.", "Penutup al-Baqarah 2:285–286, al-Fatihah dan doa."]}, {"id": 8, "section": "ASAS PENILAIAN", "title": "Nas dan ijtihad penyusun", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 103–105", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 103–105. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.\n\nPoin terakhir merupakan penjelasan analitis bagi membezakan dalil umum, dalil lafaz dan penetapan susunan amalan. Artikel tidak menyediakan takhrij lengkap atau penilaian darjat setiap riwayat.", "links": [], "type": "list", "body": ["Sebahagian lafaz mempunyai sandaran khusus dalam hadis yang dipetik artikel.", "Sebahagian doa ialah susunan atau gabungan penyusun yang penulis nilai selaras dengan prinsip umum nas.", "Sandaran keutamaan zikir tidak semestinya menetapkan keseluruhan susunan dan bilangan ratib secara khusus."]}, {"id": 9, "section": "ZIKIR 01 DARIPADA 17", "title": "Ta‘awuz pertama", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 103", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 103. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.\n\nBacaan 1. Ulangan menurut perenggan khusus artikel: 3 kali. Memohon perlindungan Allah Yang Maha Mendengar lagi Maha Mengetahui daripada syaitan yang direjam. Lafaz sepadan dengan sebahagian doa dalam Sunan Abi Dawud 775. Ulangan 3 kali di sini mengikut artikel.\nLafaz Arab dipaparkan sebagai petikan imej daripada PDF asal bagi mengekalkan bentuk cetakan sumber. Maksud ialah parafrasa. Rujukan hadis ialah atribusi artikel, bukan takhrij bebas.\n\nSemakan: 17 Oktober 2026. Lafaz Arab ialah petikan imej cetakan artikel bagi 16 bacaan. Zikir 8 diperbetulkan secara nyata menggunakan Quran NU Online kerana keciciran kalimah dalam cetakan artikel. Ini bukan petikan matan hadis lengkap. Bilangan bacaan mengikuti perenggan khusus artikel, kecuali perbezaan yang dinyatakan. Rujukan tambahan yang disemak: https://sunnah.com/abudawud:775", "links": ["https://sunnah.com/abudawud:775"], "type": "zikir", "zikir": 1, "count": "3 kali", "meaning": "Memohon perlindungan Allah Yang Maha Mendengar lagi Maha Mengetahui daripada syaitan yang direjam.", "evidence": "Lafaz sepadan dengan sebahagian doa dalam Sunan Abi Dawud 775. Ulangan 3 kali di sini mengikut artikel.", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAnAAAABRCAIAAADdHgxOAAAte0lEQVR4nO2deUBM6//4n6lUWqaahEhKWSJLSjcRioqIEq6dCJ+QruXKlvuxuxfZSWS5diGunRSlLEULJcu0TKRV+zI1Nb8/nvs9v/OZ5cyZM2dmkuf1Vz3nnOd5z/s853k/6/vN4PP5AIFAIBAIhGyoKF is yang dibincangkan", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 103–105", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 103–105. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.\n\nPoin ketiga ialah batas penggunaan sumber bagi pembentangan akademik. Elakkan menyatakan semua riwayat sahih hanya kerana disebut dalam artikel.", "links": [], "type": "list", "body": ["Sahih al-Bukhari 6407 memuatkan perumpamaan orang yang mengingati Tuhannya dan yang tidak, seperti yang hidup dan yang mati.", "Penulis turut merujuk keutamaan majlis zikir dan lafaz tertentu.", "Penilaian setiap riwayat memerlukan semakan teks, edisi dan takhrij hadis secara berasingan."]}, {"id": 29, "section": "KAEDAH PENGAMALAN", "title": "Waktu, tempat dan bimbingan", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 105–106", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 105–106. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.\n\nArtikel menyebut kelaziman selepas Isyak di Huraidah dan selepas Maghrib dalam Ramadan. Menurut penulis, pengamalan tidak terikat kepada baiah tertentu. Bezakan huraian ini daripada pengesahan hukum secara bebas.", "links": [], "type": "list", "body": ["Menurut artikel, amalan boleh dilakukan bersendirian atau berjemaah pada waktu yang sesuai.", "Masjid, surau, madrasah dan rumah antara lokasi yang disebut.", "Dalam majlis berjemaah, pembimbing membantu ketepatan bacaan dan kefahaman peserta."]}, {"id": 30, "section": "NOTA AKADEMIK", "title": "Ketelitian membaca sumber", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 103–105", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 103–105. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.\n\nAudit berdasarkan senarai khusus: bacaan 1,2,3,5,6,7,8,9,11,12 sebanyak 3 kali (10 bacaan). Bacaan 4 = 10, 10 = 4, 13 = 40–100, 14 = 7, 15–17 = 11 kali. Jumlah 17 bacaan. Artikel menulis al-Ahzab 21:56 sedangkan surah al-Ahzab bernombor 33. Terjemahan basmalah pada hlm.103 menggunakan Maha Mengetahui untuk al-Rahim. Slaid memberi maksud lazim Maha Penyayang.", "links": [], "type": "list", "body": ["Bilangan zikir: perenggan khusus menyebut 11 kali bagi bacaan 15, 16 dan 17, tetapi rumusan menyebut hanya dua bacaan 11 kali.", "Rumusan artikel menyebut 12 bacaan diulang 3 kali. Senarai perenggan khusus memberikan 10 bacaan sedemikian.", "Beberapa nombor surah dan terjemahan menunjukkan ketidakselarasan editorial. Rujukan perlu disemak sebelum penerbitan semula."]}, {"id": 31, "section": "PENUTUP", "title": "Rumusan penulis dan batas dapatan", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 106", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 106. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.\n\nKekalkan atribusi kepada penulis. Jangan gambarkan artikel tunggal ini sebagai mewakili ijmak ulama atau bukti klinikal.", "links": [], "type": "list", "body": ["Penulis menyimpulkan 17 zikir dan bentuk pengamalan Ratib al-Attas selaras dengan dalil yang mereka bincangkan.", "Artikel mencadangkan peluasan amalan dalam komuniti, institusi pendidikan dan tempat ibadah.", "Kesimpulan ini ialah penilaian keagamaan berasaskan sumber yang dipilih oleh penulis. Tiada pengujian empirikal kesan kesejahteraan."]}, {"id": 32, "section": "CATATAN TERHADAP CETAKAN ARTIKEL", "title": "Pembetulan rujukan al-Quran", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 104–105", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 104–105. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.\n\nPembetulan merujuk penomboran dan kandungan ayat. Sumber semakan: https://quran.com/7/180 ; https://quran.com/17/110 ; https://quran.com/33/56 ; https://quran.com/15/87 . Bentuk salah ialah sebagaimana dicetak dalam PDF asal.", "links": ["https://quran.com/7/180", "https://quran.com/17/110", "https://quran.com/33/56", "https://quran.com/15/87"], "type": "list", "body": ["Asmaul Husna: al-A‘raf 7:180, bukan 7:108. Al-Isra’ 17:110, bukan 15:110.", "Perintah berselawat: al-Ahzab 33:56, bukan 21:56.", "Tujuh ayat yang berulang: al-Hijr 15:87, bukan 14:87."]}, {"id": 33, "section": "CATATAN TERHADAP CETAKAN ARTIKEL", "title": "Terjemahan dan bilangan bacaan", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 103–105", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 103–105. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.\n\nSemakan basmalah: https://quran.com/1/1 . Perbandingan bilangan menunjukkan 10 bacaan sebanyak 3 kali, 3 bacaan sebanyak 11 kali, dan masing-masing 1 bacaan sebanyak 4, 7, 10 serta 40–100 kali. Jumlah 17. Tambahan ta’ibuna ilallah 3 kali disebut berasingan selepas zikir 16.", "links": ["https://quran.com/1/1"], "type": "list", "body": ["Basmalah: al-Rahim diterjemahkan sebagai Maha Penyayang. Cetakan artikel menggunakan Maha Mengetahui.", "Bilangan dalam slaid mengikuti setiap perenggan khusus. Rumusan bilangan pada halaman 105 tidak sepadan dengan senarai tersebut.", "Lafaz zikir 8 diperbetulkan mengikut Quran NU Online kerana keciciran kalimah dalam cetakan artikel. Rujukan pembetulan tersedia dalam nota."]}, {"id": 34, "section": "SUMBER PEMBENTANGAN", "title": "Rujukan utama", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 101–107", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 101–107. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.", "links": [], "type": "reference", "body": ["Mohsin, M. A., Md Baharudin, M. H. A., Abdullah, N.,\nMd. Sawari, S. S., Napiah, O., Mohd. Noor, S. S.,\n& Jasmi, K. A. (2016).", "Ratib al-Attas Menurut Perspektif al-Quran dan Hadis.\nSains Humanika, 8(3–2), 101–107.", "DOI: 10.11113/sh.v8n3-2.970\nPetikan asal, parafrasa dan rujukan tambahan dibezakan dalam nota slaid."]}, {"id": 35, "section": "PENUTUP", "title": "Perbincangan", "footer": "MOHSIN ET AL. (2016)   /   SAINS HUMANIKA   /   HLM. 101–107", "notes": "Sumber utama: Mohd Azman Mohsin et al. (2016). Ratib al-Attas Menurut Perspektif al-Quran dan Hadis. Sains Humanika, 8(3–2), 101–107. Halaman 101–107. Semua huraian mengikuti artikel kecuali nota penilaian sumber yang dinyatakan.", "links": [], "type": "closing", "body": ["Bagaimanakah kefahaman terhadap maksud zikir\ndapat menyokong pengamalan yang lebih sedar?", "Sejarah memberi konteks. Sumber memberi asas.\nBimbingan membantu kefahaman bacaan."]}]</script>

const slides=JSON.parse(document.getElementById('slide-data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paras=s=>esc(s).replace(/\n/g,'<br>');
let current=0,showNotes=false,startX=null,noticeTimer;
function footer(s){return `<div class="source-row"><span>${esc(s.footer)}</span><button class="slide-source" data-source="${s.id}">Rujukan & catatan</button></div>`}
function slideMarkup(s){let body='';
 if(s.type==='cover'){return `<article class="slide cover" aria-label="Slaid 1"><p class="eyebrow">TAZKIRAH MAGHRIB</p><h1>Ratib al-Attas</h1><p class="subtitle">Menurut perspektif al-Quran dan hadis</p><div class="event">Tazkirah Maghrib sempena<br><strong>Kem Pembentukan JKP Kolej Tun Razak,</strong><br>Universiti Teknologi Malaysia <strong>2026/2027</strong></div><div class="attribution">Berdasarkan artikel Mohd Azman Mohsin dan rakan-rakan<br>Sains Humanika 8(3–2), 2016, halaman 101–107</div>${footer(s)}</article>`}
 if(s.type==='zikir')body=`<div class="z-top"><span>ULANGAN DALAM ARTIKEL</span><strong>${esc(s.count)}</strong></div><div class="arabic"><img src="${s.image}" alt="Petikan asal lafaz zikir ${s.zikir}: ${esc(s.title)}" lang="ar"></div><p class="meaning-label">HURAIAN MAKSUD (PARAFRASA)</p><p class="meaning">${esc(s.meaning)}</p><p class="evidence">${esc(s.evidence)}</p>`;
 else if(s.type==='closing')body=`<p class="lead">${paras(s.body[0])}</p><p class="endnote">${paras(s.body[1])}</p>`;
 else if(s.type==='reference')body=`<div class="ref-body">${s.body.map(x=>`<p>${paras(x)}</p>`).join('')}</div>`;
 else body=`<ol class="points">${s.body.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol>`;
 return `<article class="slide ${s.type}" aria-label="Slaid ${s.id}"><p class="eyebrow">${esc(s.section)}</p><h1>${esc(s.title)}</h1>${body}${footer(s)}</article>`;
}
function hashIndex(){const m=location.hash.match(/^#slaid-(\d+)$/);return m?Math.max(0,Math.min(slides.length-1,Number(m[1])-1)):0}
function render(){const s=slides[current];$('main').innerHTML=slideMarkup(s);$('counter').textContent=`${current+1} / ${slides.length}`;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('bar').style.width=`${(current+1)/slides.length*100}%`;$('progress').setAttribute('aria-valuenow',String(current+1));document.title=`${s.title} · Tazkirah Maghrib KTR`;$('notes').hidden=!showNotes;$('notes').innerHTML=`<h2>Nota pembentang · Slaid ${s.id}</h2><div>${paras(s.notes)}</div>`;$('notes-top').setAttribute('aria-pressed',String(showNotes));document.querySelectorAll('[data-slide]').forEach(x=>x.setAttribute('aria-current',String(Number(x.dataset.slide)===current)));}
function go(n){const next=Math.max(0,Math.min(slides.length-1,n));if(next===current)return;current=next;history.replaceState(null,'',`#slaid-${current+1}`);render();window.scrollTo({top:0,behavior:'instant'})}
function notify(msg){$('notice').textContent=msg;$('notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').hidden=true,4500)}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{notify('Pelayar ini tidak menyokong mod skrin penuh. Gunakan paparan landskap.')}}catch(e){notify('Skrin penuh tidak tersedia dalam paparan ini.')}}
function toggleNotes(){showNotes=!showNotes;render()}
function showSources(n=current){const s=slides[n];const urls=[...new Set(['https://sainshumanika.utm.my/index.php/sainshumanika/article/view/970','https://quran.nu.or.id/wirid/ratib/ratib-al-athas',...s.links])];$('source-body').innerHTML=`<p><strong>Slaid ${s.id}: ${esc(s.title)}</strong></p><p>Mohd Azman Mohsin et al. (2016). <em>Ratib al-Attas Menurut Perspektif al-Quran dan Hadis.</em> Sains Humanika, 8(3–2), 101–107. DOI: 10.11113/sh.v8n3-2.970.</p><p>Sebanyak 16 lafaz menggunakan imej artikel asal. Lafaz zikir 8 diperbetulkan mengikut Quran NU Online dengan catatan sumber. Huraian Bahasa Melayu ialah parafrasa. Lafaz ratib, petikan ayat al-Quran dan matan hadis penuh tidak disamakan.</p><ul>${urls.map(url=>`<li><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a></li>`).join('')}</ul><details><summary>Catatan khusus slaid</summary><p style="white-space:pre-line">${esc(s.notes)}</p></details><p class="audit-note">Semakan 17 Oktober 2026: kesilapan rujukan cetakan dan perbezaan bilangan ditandakan pada slaid 30, 32 dan 33. Perbandingan sumber ini tidak menggantikan takhrij lengkap semua riwayat artikel.</p>`;$('source-dialog').showModal()}
$('prev').addEventListener('click',()=>go(current-1));$('next').addEventListener('click',()=>go(current+1));$('full').addEventListener('click',fullscreen);$('notes-top').addEventListener('click',toggleNotes);$('sources').addEventListener('click',()=>showSources());$('all').addEventListener('click',()=>{$('overview-dialog').showModal();$('overview').querySelector(`[data-slide="${current}"]`)?.focus()});
$('overview').innerHTML=slides.map((s,i)=>`<button data-slide="${i}" aria-current="false"><span>${String(i+1).padStart(2,'0')} · ${esc(s.section)}</span><strong>${esc(s.title)}</strong></button>`).join('');
$('overview').addEventListener('click',e=>{const b=e.target.closest('[data-slide]');if(b){go(Number(b.dataset.slide));$('overview-dialog').close()}});
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)$(close.dataset.close).close();const source=e.target.closest('[data-source]');if(source)showSources(Number(source.dataset.source)-1)});
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)dialog.close()}});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(document.querySelector('dialog[open]'))return;const k=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();go(current+1)}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();go(current-1)}else if(k==='home'){e.preventDefault();go(0)}else if(k==='end'){e.preventDefault();go(slides.length-1)}else if(k==='f')fullscreen();else if(k==='n')toggleNotes();else if(k==='g')$('all').click();else if(k==='b')$('blackout').hidden=!$('blackout').hidden;else if(k==='escape')$('blackout').hidden=true});
$('blackout').addEventListener('click',()=>$('blackout').hidden=true);
$('main').addEventListener('touchstart',e=>{startX=e.touches.length===1?e.touches[0].clientX:null},{passive:true});$('main').addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>90)go(current+(dx<0?1:-1));startX=null},{passive:true});
window.addEventListener('hashchange',()=>{current=hashIndex();render()});
window.addEventListener('beforeprint',()=>{$('print-deck').innerHTML=slides.map(slideMarkup).join('')});window.addEventListener('afterprint',()=>$('print-deck').innerHTML='');
current=hashIndex();render();
</script>
</body></html>
